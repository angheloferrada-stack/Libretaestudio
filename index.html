<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F7">
<title>Huilén · Bailes del conjunto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F7;--ink:#14181C;--mute:#5F6B73;--line:#E2E5E7;--teal:#0E7C86;--mag:#C2308A;--pur:#7B3FBF;--blue:#1479B8;--grad:linear-gradient(90deg,#14B8A6,#22A6D9 45%,#B24FD1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "DM Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.1;margin:0;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid #22A6D9;outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 18px}

/* Barra superior */
.top{position:sticky;top:0;z-index:5;background:rgba(247,247,247,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-top:8px;padding-bottom:8px}
.brand{margin-right:auto;display:block}
.brand img{height:56px;width:auto;display:block;mix-blend-mode:multiply}
.line{height:3px;background:var(--grad)}
.pill{font:600 .74rem/1 "DM Sans",sans-serif;letter-spacing:.06em;padding:8px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--mute);cursor:pointer}
.btn{font:600 .9rem/1 "DM Sans",sans-serif;padding:12px 18px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.small{padding:9px 14px;font-size:.82rem}
.btn.pri{background:var(--ink);color:#fff}
.btn.acc{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{border-color:#B3261E;color:#B3261E}
.btn:disabled{opacity:.5;cursor:wait}

/* Inicio */
.kick{font:600 .72rem/1 "DM Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.hero{padding:26px 0 4px}
.hero h1{font-size:2.4rem;margin-top:12px}
.hero p{color:var(--mute);margin:8px 0 0}
.search{position:relative;margin:18px 0 6px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;padding:13px 16px 13px 46px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{--c:var(--teal);display:flex;flex-direction:column;gap:12px;min-height:158px;padding:18px 16px 16px;background:#fff;border:1px solid var(--line);border-radius:20px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.card .ini{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 1.35rem Fraunces,Georgia,serif;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff)}
.card h2{font-size:1.2rem;margin-top:auto;overflow-wrap:anywhere}
.card small{color:var(--mute);font-size:.84rem}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 12px 26px -16px rgba(20,24,28,.4)}}

/* Listas */
.row{--c:var(--teal);display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;margin-bottom:9px}
.row b{font:700 1.1rem/1.2 Fraunces,Georgia,serif;display:block}
.row small{display:block;color:var(--mute);margin-top:3px;font-size:.85rem}
.row .go{margin-left:auto;color:var(--mute);font-size:1.5rem}
.back{display:inline-flex;gap:6px;align-items:center;margin:20px 0 4px;color:var(--mute);font-weight:600;font-size:.9rem}
.lhead{--c:var(--teal);margin:6px 0 18px}
.lhead h1{font-size:2.2rem;margin-top:10px;color:var(--ink);overflow-wrap:anywhere}
.lhead .kick{color:var(--c)}

/* Detalle */
.det{--c:var(--teal)}
.det .kick{color:var(--c)}
.det h1{font-size:2.3rem;margin:10px 0 14px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:.85rem}
.chip b{color:var(--mute);font-weight:600;margin-right:4px}
.sec{margin-top:30px}
.sec>h3{font-size:1.3rem;margin-bottom:12px}
.vid{margin-bottom:20px}
.vid p{margin:0 0 7px;font-weight:600}
video{width:100%;max-height:70vh;border-radius:14px;background:#000;display:block}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.photos button{padding:0;border:0;background:none;text-align:left;cursor:zoom-in}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:12px;background:#E9ECEE}
.photos span{display:block;font-size:.84rem;color:var(--mute);padding:6px 2px 0}
.text{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.admin-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.empty{padding:44px 8px;text-align:center;color:var(--mute)}
.foot{margin:44px 0 28px;text-align:center;color:var(--mute);font-size:.85rem}
.foot .pill{margin-left:6px}

/* Diálogos */
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(20,24,28,.55)}
.dlg{padding:22px 20px 20px}
.dlg h2{font-size:1.65rem;margin-bottom:4px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 5px}
.dlg input,.dlg textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.hint{color:var(--mute);font-size:.84rem;margin:6px 0 0}
.mrow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.mrow .th{width:52px;height:52px;border-radius:8px;background:#E9ECEE;display:grid;place-items:center;overflow:hidden;flex:none;font-size:.62rem;font-weight:700;letter-spacing:.08em;color:var(--mute)}
.mrow .th img{width:100%;height:100%;object-fit:cover}
.mrow input{flex:1;min-width:0;padding:9px 10px!important}
.mrow .x{border:0;background:none;color:#B3261E;font-size:1.1rem;cursor:pointer;padding:8px}
progress{width:100%;height:10px;accent-color:var(--teal);margin-top:10px}
.msg{color:#B3261E;min-height:1.4em;margin-top:8px;font-size:.9rem}
.cl{margin:0 0 18px}
.cl h3{font-size:1.2rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cl .tag{font:600 .66rem/1 "DM Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--teal);color:#fff;border-radius:99px;padding:4px 8px}
.cl time{color:var(--mute);font-size:.85rem}
.cl ul{margin:8px 0 0;padding-left:20px}
.cl li{margin:3px 0}
#dImg{width:min(96vw,900px);background:#000;color:#fff}
#dImg img{width:100%;max-height:80vh;object-fit:contain;display:block}
#dImg p{margin:0;padding:10px 16px 0}
#dImg .acts{padding:0 16px 14px}
.tabs{display:flex;gap:4px;margin:18px 0 6px;border-bottom:1px solid var(--line)}
.tabs a{padding:11px 14px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--c)}
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
@media(min-width:640px){.vgrid{grid-template-columns:repeat(3,1fr)}}
.vgrid figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vgrid img,.nofoto{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff}
.nofoto{display:grid;place-items:center;background:#EEF1F2;color:var(--mute);font-size:.85rem}
.vgrid figcaption{padding:10px 12px 12px;font-weight:600;font-size:.92rem;line-height:1.3}
.tabs.sub{margin-top:0;border-bottom:0;gap:8px;padding:12px 0 2px}
.tabs.sub a{border:1.5px solid var(--line);border-radius:99px;background:#fff;margin:0;padding:8px 14px;font-size:.88rem}
.tabs.sub a.on{background:var(--c);border-color:var(--c);color:#fff}
.vtools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.vsub{font-size:1.15rem;margin:26px 0 0}
.vact{display:flex;gap:6px;padding:0 12px 12px}
.vgrid figure .vact .btn{padding:7px 12px;font-size:.78rem}
select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Huilén, conjunto folclórico. Ir al inicio"><img src="logo.png" alt="Huilén conjunto folclórico"></a>
    <button class="pill" id="btnVer" aria-label="Ver versión y cambios"></button>
    <span id="adminBar"></span>
  </div>
  <div class="line"></div>
</header>

<main class="wrap">
  <div id="searchbox" class="search" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar baile, cuadro, país o región" aria-label="Buscar">
  </div>
  <div id="view"></div>
  <div class="foot">Conjunto folclórico Huilén <button class="pill" id="btnVer2"></button></div>
</main>

<dialog id="dLogin"><form class="dlg" id="fLogin">
  <h2>Ingreso admin</h2>
  <p class="hint">Solo para quienes pueden subir y editar bailes.</p>
  <label for="em">Correo</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
  <div class="msg" id="loginMsg"></div>
  <div class="acts"><button type="button" class="btn small" data-close>Cancelar</button><button class="btn small acc">Entrar</button></div>
</form></dialog>

<dialog id="dAdd"><form class="dlg" id="fAdd">
  <h2 id="addTitle">Agregar baile</h2>
  <label for="nombre">Nombre del baile</label><input id="nombre" required>
  <label for="cuadro">Cuadro</label><input id="cuadro" list="lCuadros" placeholder="Ej: Perú, Colombia, Rapa Nui" required><datalist id="lCuadros"></datalist>
  <label for="subtipo">Baile o subtipo (opcional)</label><input id="subtipo" list="lSubs" placeholder="Ej: Tondero, Cumbia"><datalist id="lSubs"></datalist>
  <div class="two">
    <div><label for="pais">País</label><input id="pais" list="lPaises" required><datalist id="lPaises"></datalist></div>
    <div><label for="region">Región o zona</label><input id="region" list="lRegiones" required><datalist id="lRegiones"></datalist></div>
  </div>
  <label for="signif">Significado</label><textarea id="signif" rows="3"></textarea>
  <label for="letra">Letra o traducción (opcional)</label><textarea id="letra" rows="4"></textarea>
  <label>Videos y fotos</label>
  <div id="mlist"></div>
  <label class="btn small" for="files" style="display:inline-block;margin:4px 0 0;cursor:pointer">+ Agregar videos o fotos</label>
  <input id="files" type="file" accept="video/*,image/*" multiple hidden>
  <p class="hint">Videos de hasta 100 MB. Las fotos se reducen solas antes de subirlas. Ponle un título a cada archivo (ej. "Zapateo", "Coreografía 2").</p>
  <progress id="prog" max="100" value="0" hidden></progress>
  <div class="msg" id="addMsg" role="alert"></div>
  <div class="acts"><button type="button" class="btn small" data-close>Cancelar</button><button class="btn small acc" id="btnSave">Guardar baile</button></div>
</form></dialog>

<dialog id="dVest"><form class="dlg" id="fVest">
  <h2 id="vTitle">Agregar prenda</h2>
  <label for="vNom">Nombre de la prenda</label><input id="vNom" required>
  <div class="two">
    <div><label for="vGen">Vestuario de</label><select id="vGen"><option value="h">Hombre</option><option value="m">Mujer</option></select></div>
    <div><label for="vAlc">Se usa en</label><select id="vAlc"></select></div>
  </div>
  <label for="vFoto">Foto (opcional)</label><input id="vFoto" type="file" accept="image/*">
  <p class="hint" id="vActual"></p>
  <progress id="vProg" max="100" value="0" hidden></progress>
  <div class="msg" id="vMsg" role="alert"></div>
  <div class="acts"><button type="button" class="btn small" data-close>Cancelar</button><button class="btn small acc" id="vSave">Guardar prenda</button></div>
</form></dialog>

<dialog id="dVer"><div class="dlg">
  <h2>Novedades</h2>
  <p class="hint" id="verNow" style="margin-bottom:18px"></p>
  <div id="verList"></div>
  <div class="acts"><button type="button" class="btn small" data-close>Cerrar</button></div>
</div></dialog>

<dialog id="dImg"><img id="imgBig" alt=""><p id="imgCap"></p><div class="acts"><button type="button" class="btn small" data-close style="color:#fff;border-color:#fff">Cerrar</button></div></dialog>

const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//i.test(u||"")?u:"";
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").toLowerCase().trim();
const PAL=["#0E7C86","#C2308A","#7B3FBF","#1479B8"];
const colorOf=k=>{let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const mediaOf=b=>Array.isArray(b.media)?b.media:(b.videoUrl?[{tipo:"video",url:b.videoUrl,titulo:"Video de ensayo"}]:[]);
const MAX_VIDEO=100*1024*1024;
const SAFE_FOTO=/^[a-f0-9]+\.jpg$/;
const fotoOk=f=>SAFE_FOTO.test(f||"")||!!safe(f);

/* "Perú (Tondero)" => cuadro "Perú", baile/subtipo "Tondero" */
const MX=new Set(["jalisco","veracruz","yucatan","sonora","tabasco","tamaulipas","michoacan"]);
const parseCuadro=n=>{
  const s=String(n??"").replace(/\s+/g," ").trim();const m=s.match(/^(.+?)\s*\((.+)\)$/);
  let r=m?{padre:m[1].trim(),sub:m[2].trim()}:{padre:s,sub:""};
  if(MX.has(norm(r.padre)))r={padre:"México",sub:r.sub?`${r.padre} (${r.sub})`:r.padre};
  return r;
};
const normVest=x=>{const r=parseCuadro(x.padre+(x.baile?` (${x.baile})`:""));return {...x,padre:r.padre,baile:r.sub}};
const padreOf=b=>parseCuadro(b.cuadro).padre||"Sin cuadro";
const subOf=b=>String(b.subtipo||"").trim()||parseCuadro(b.cuadro).sub;

/* Vestuario base (del Word y del Excel): sólo hombres */
const BASE_VEST=[];
for(const k of Object.keys(VEST_DATA.vest)){
  const {padre,sub}=parseCuadro(k);
  for(const it of VEST_DATA.vest[k].items)BASE_VEST.push({padre,baile:sub,genero:"h",nombre:it.n,foto:it.f||""});
}

let bailes=[],loaded=false,loadErr=false,txt="",user=null,vestDocs=[];

/* ---------- Datos ---------- */
onSnapshot(query(collection(db,"bailes"),orderBy("nombre")),
  s=>{bailes=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;loadErr=false;updateLists();render()},
  ()=>{loaded=true;loadErr=true;render()});
onSnapshot(collection(db,"vestuario"),
  s=>{vestDocs=s.docs.map(d=>normVest({id:d.id,...d.data()}));render()},
  ()=>{vestDocs=[];render()});
onAuthStateChanged(auth,u=>{user=u;renderAdminBar();render()});

function padres(){
  const m=new Map();
  const add=p=>{const k=norm(p);if(!m.has(k))m.set(k,{key:k,name:p,subs:new Set(),bailes:[]});return m.get(k)};
  for(const n of VEST_DATA.cuadros){const {padre,sub}=parseCuadro(n);const c=add(padre);if(sub)c.subs.add(sub)}
  for(const x of vestDocs){if(x.padre){const c=add(x.padre);if(x.baile)c.subs.add(x.baile)}}
  for(const b of bailes){const c=add(padreOf(b));c.bailes.push(b);const s=subOf(b);if(s)c.subs.add(s)}
  const out=[...m.values()].map(c=>({...c,subs:[...c.subs].sort((a,b)=>a.localeCompare(b,"es"))}));
  out.forEach(c=>c.bailes.sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),"es")));
  return out.sort((a,b)=>a.key==="sin cuadro"?1:b.key==="sin cuadro"?-1:a.name.localeCompare(b.name,"es"));
}
function updateLists(){
  const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,"es")).map(v=>`<option value="${esc(v)}">`).join("");
  const ps=padres();
  $("lCuadros").innerHTML=uniq(ps.filter(p=>p.key!=="sin cuadro").map(p=>p.name));
  $("lSubs").innerHTML=uniq(ps.flatMap(p=>p.subs));
  $("lPaises").innerHTML=uniq(bailes.map(b=>b.pais));
  $("lRegiones").innerHTML=uniq(bailes.map(b=>b.region));
}

/* ---------- Vistas ---------- */
const getRoute=()=>location.hash.replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
const plural=(n,s)=>`${n} ${s}${n===1?"":"s"}`;

function rowHtml(b,showCuadro){
  const c=padreOf(b),m=mediaOf(b),v=m.filter(x=>x.tipo==="video").length,f=m.length-v;
  const meta=[showCuadro?c:"",subOf(b),b.pais,b.region].filter(Boolean).join(" · ");
  const cnt=[v?plural(v,"video"):"",f?plural(f,"foto"):""].filter(Boolean).join(" · ")||"Sin videos ni fotos aún";
  return `<a class="row" style="--c:${colorOf(norm(c))}" href="#/b/${esc(b.id)}"><span><b>${esc(b.nombre)}</b><small>${esc(meta)}</small><small>${cnt}</small></span><span class="go" aria-hidden="true">›</span></a>`;
}

function homeView(){
  const q=norm(txt);
  if(q){
    const f=bailes.filter(b=>norm([b.nombre,padreOf(b),subOf(b),b.pais,b.region].join(" ")).includes(q));
    return `<p class="kick" style="margin:18px 0 12px">${plural(f.length,"resultado")}</p>`+(f.length?f.map(b=>rowHtml(b,true)).join(""):`<div class="empty">Ningún baile coincide con tu búsqueda.</div>`);
  }
  const hero=`<div class="hero"><span class="kick">Repertorio</span><h1>Nuestros cuadros</h1><p>Elige un cuadro para ver sus bailes, su vestuario, videos y letras.</p></div>`;
  return hero+`<div class="grid">`+padres().map(c=>{
    const t=[c.bailes.length?plural(c.bailes.length,"baile"):"Sin videos aún",c.subs.length?plural(c.subs.length,"subtipo"):""].filter(Boolean).join(" · ");
    return `<a class="card" style="--c:${colorOf(c.key)}" href="#/c/${encodeURIComponent(c.key)}"><span class="ini" aria-hidden="true">${esc(c.name.charAt(0).toUpperCase())}</span><h2>${esc(c.name)}</h2><small>${esc(t)}</small></a>`;
  }).join("")+`</div>`;
}

function tabsHtml(key,active,color){
  const k=encodeURIComponent(key);
  return `<nav class="tabs" style="--c:${color}" aria-label="Secciones del cuadro"><a href="#/c/${k}" ${active==="b"?'aria-current="page" class="on"':""}>Bailes</a><a href="#/c/${k}/v" ${active==="v"?'aria-current="page" class="on"':""}>Vestuario</a></nav>`;
}
const backHtml=`<a class="back" href="#/">← Todos los cuadros</a>`;

function cuadroView(key){
  const c=padres().find(x=>x.key===key);
  if(!c)return backHtml+`<div class="empty">Ese cuadro ya no existe.</div>`;
  const col=colorOf(c.key);
  const kick=["Cuadro",c.subs.length?c.subs.join(", "):""].filter(Boolean).join(" · ");
  return backHtml+`<div class="lhead" style="--c:${col}"><span class="kick">${esc(kick)}</span><h1>${esc(c.name)}</h1></div>`+tabsHtml(key,"b",col)+(c.bailes.length?c.bailes.map(b=>rowHtml(b,false)).join(""):`<div class="empty">Este cuadro aún no tiene bailes con video. Revisa su pestaña Vestuario.</div>`);
}

/* ---------- Vestuario ---------- */
function vestuarioView(key,g){
  const c=padres().find(x=>x.key===key);
  if(!c)return backHtml+`<div class="empty">Ese cuadro ya no existe.</div>`;
  g=g==="m"?"m":"h";
  const col=colorOf(c.key),k=encodeURIComponent(key);
  const usingBase=vestDocs.length===0;
  const src=usingBase?BASE_VEST:vestDocs;
  const items=src.filter(x=>norm(x.padre)===c.key&&(x.genero||"h")===g);
  const sub=`<nav class="tabs sub" style="--c:${col}" aria-label="Vestuario hombre o mujer"><a href="#/c/${k}/v/h" ${g==="h"?'aria-current="page" class="on"':""}>Vestuario hombre</a><a href="#/c/${k}/v/m" ${g==="m"?'aria-current="page" class="on"':""}>Vestuario mujer</a></nav>`;
  let admin="";
  if(user){
    admin=`<div class="vtools"><button class="btn small acc" data-act="vnew" data-k="${esc(key)}" data-g="${g}">+ Agregar prenda</button></div>`;
    if(usingBase)admin+=`<p class="hint" style="margin:10px 0 0">Este vestuario viene del Word y del Excel del conjunto. Para poder editarlo desde la app, guárdalo primero:</p><div class="vtools"><button class="btn small" data-act="vimport">Guardar vestuario base en la app</button></div>`;
  }
  const order=[""].concat(c.subs);
  for(const x of items)if(!order.includes(x.baile||""))order.push(x.baile||"");
  const groups=order.map(s=>({t:s,items:items.filter(x=>(x.baile||"")===s)})).filter(G=>G.items.length);
  const fig=x=>`<figure>${fotoOk(x.foto)?`<img loading="lazy" src="${esc(x.foto)}" alt="${esc(x.nombre)}">`:`<div class="nofoto">Sin foto aún</div>`}<figcaption>${esc(x.nombre)}</figcaption>${user&&!usingBase&&x.id?`<div class="vact"><button class="btn small" data-act="vedit" data-id="${esc(x.id)}">Editar</button><button class="btn small danger" data-act="vdel" data-id="${esc(x.id)}">Eliminar</button></div>`:""}</figure>`;
  let body="";
  for(const G of groups){
    const t=G.t||(c.subs.length?"Para todo el cuadro":"");
    body+=(t?`<h3 class="vsub">${esc(t)}</h3>`:"")+`<div class="vgrid">${G.items.map(fig).join("")}</div>`;
  }
  if(!groups.length)body=`<div class="empty">${g==="m"?"Aún no hay prendas de mujer en este cuadro.":"Vestuario pendiente de cargar."}</div>`;
  return backHtml+`<div class="lhead" style="--c:${col}"><span class="kick">Cuadro · Vestuario</span><h1>${esc(c.name)}</h1></div>`+tabsHtml(key,"v",col)+sub+admin+body;
}

/* ---------- Detalle de baile ---------- */
function detailView(id){
  const b=bailes.find(x=>x.id===id);
  if(!b)return backHtml+`<div class="empty">No encontré ese baile.</div>`;
  const c=padreOf(b),ck=norm(c),s=subOf(b),m=mediaOf(b);
  const vids=m.filter(x=>x.tipo==="video"&&safe(x.url)),pics=m.filter(x=>x.tipo!=="video"&&safe(x.url));
  return `<a class="back" href="#/c/${encodeURIComponent(ck)}">← ${esc(c)}</a>
  <article class="det" style="--c:${colorOf(ck)}">
    <span class="kick">Cuadro ${esc(c)}${s?" · "+esc(s):""}</span>
    <h1>${esc(b.nombre)}</h1>
    <div class="chips">${s?`<span class="chip"><b>Baile</b>${esc(s)}</span>`:""}${b.pais?`<span class="chip"><b>País</b>${esc(b.pais)}</span>`:""}${b.region?`<span class="chip"><b>Región</b>${esc(b.region)}</span>`:""}</div>
    ${vids.length?`<section class="sec"><h3>Videos</h3>${vids.map((x,i)=>`<div class="vid"><p>${esc(x.titulo||"Video "+(i+1))}</p><video src="${esc(safe(x.url))}#t=0.1" controls playsinline preload="metadata"></video></div>`).join("")}</section>`:""}
    ${pics.length?`<section class="sec"><h3>Fotos</h3><div class="photos">${pics.map(x=>`<button type="button" data-zoom="${esc(safe(x.url))}" data-cap="${esc(x.titulo||"")}"><img loading="lazy" src="${esc(safe(x.url))}" alt="${esc(x.titulo||b.nombre)}">${x.titulo?`<span>${esc(x.titulo)}</span>`:""}</button>`).join("")}</div></section>`:""}
    ${!vids.length&&!pics.length?`<p class="hint" style="margin-top:26px">Este baile aún no tiene videos ni fotos.</p>`:""}
    ${b.significado?`<section class="sec"><h3>Significado</h3><div class="text">${esc(b.significado)}</div></section>`:""}
    ${b.letra?`<section class="sec"><h3>Letra</h3><div class="text">${esc(b.letra)}</div></section>`:""}
    ${user?`<div class="admin-acts"><button class="btn small" data-act="edit" data-id="${esc(b.id)}">Editar baile</button><button class="btn small danger" data-act="del" data-id="${esc(b.id)}">Eliminar baile</button></div>`:""}
  </article>`;
}

function render(){
  const r=getRoute(),t=r[0],id=r[1];
  $("searchbox").hidden=!!t;
  if(!loaded){$("view").innerHTML=`<div class="empty">Cargando…</div>`;return}
  if(loadErr){$("view").innerHTML=`<div class="empty">No se pudo cargar el catálogo. Revisa tu conexión o la configuración de Firebase.</div>`;return}
  $("view").innerHTML=t==="c"?(r[2]==="v"?vestuarioView(id,r[3]):cuadroView(id)):t==="b"?detailView(id):homeView();
}
function renderAdminBar(){
  $("adminBar").innerHTML=user
    ?`<button class="btn small acc" data-act="new">+ Agregar baile</button> <button class="btn small" data-act="out">Salir</button>`
    :`<button class="btn small" data-act="login">Ingreso admin</button>`;
}
window.addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});

document.addEventListener("click",e=>{
  const close=e.target.closest("[data-close]");if(close){close.closest("dialog").close();return}
  if(e.target.closest("#btnVer,#btnVer2")){$("dVer").showModal();return}
  const z=e.target.closest("[data-zoom]");
  if(z){$("imgBig").src=z.dataset.zoom;$("imgBig").alt=z.dataset.cap||"Foto";$("imgCap").textContent=z.dataset.cap||"";$("dImg").showModal();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="login")$("dLogin").showModal();
  else if(act==="out")signOut(auth);
  else if(act==="new")openForm(null);
  else if(act==="edit")openForm(bailes.find(x=>x.id===a.dataset.id));
  else if(act==="del")deleteBaile(a.dataset.id);
  else if(act==="vnew")openVest(null,a.dataset.k,a.dataset.g);
  else if(act==="vedit"){const x=vestDocs.find(v=>v.id===a.dataset.id);if(x)openVest(x,norm(x.padre),x.genero)}
  else if(act==="vdel")deleteVest(a.dataset.id);
  else if(act==="vimport")importBase(a);
});

async function deleteBaile(id){
  const b=bailes.find(x=>x.id===id);if(!b)return;
  if(!confirm(`¿Eliminar "${b.nombre}" del catálogo?\n\nLos videos y fotos quedan guardados en Cloudinary; puedes borrarlos allá para liberar espacio.`))return;
  try{await deleteDoc(doc(db,"bailes",id));location.hash="#/"}
  catch(err){alert("No se pudo eliminar: "+err.message)}
}

/* ---------- Login ---------- */
$("fLogin").onsubmit=async e=>{
  e.preventDefault();$("loginMsg").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value,$("pw").value);$("dLogin").close();$("fLogin").reset()}
  catch{$("loginMsg").textContent="Correo o contraseña incorrectos."}
};

/* ---------- Subida a Cloudinary ---------- */
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);
    const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
    return blob?new File([blob],file.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"}):file;
  }catch{return file}
}
function uploadFile(file,onProg){
  return new Promise((ok,no)=>{
    const x=new XMLHttpRequest(),fd=new FormData();
    fd.append("file",file);fd.append("upload_preset",UPLOAD_PRESET);
    x.open("POST",`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);
    x.upload.onprogress=ev=>{if(ev.lengthComputable)onProg(ev.loaded/ev.total*100)};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch{}x.status===200?ok(j):no(new Error(j.error?.message||"error de subida"))};
    x.onerror=()=>no(new Error("sin conexión"));
    x.send(fd);
  });
}

/* ---------- Formulario de prenda (vestuario) ---------- */
let vEdit=null,vPadre=null,vFotoActual="";
function openVest(x,padreKey,g){
  const c=padres().find(p=>p.key===padreKey);if(!c)return;
  vEdit=x?x.id:null;vPadre=c;vFotoActual=x?(x.foto||""):"";
  $("fVest").reset();
  $("vTitle").textContent=(x?"Editar prenda":"Agregar prenda")+" · "+c.name;
  $("vAlc").innerHTML=`<option value="">Todo el cuadro</option>`+c.subs.map(s=>`<option value="${esc(s)}">Sólo ${esc(s)}</option>`).join("");
  $("vNom").value=x?x.nombre:"";
  $("vGen").value=(x?x.genero:g)==="m"?"m":"h";
  $("vAlc").value=x?(x.baile||""):"";
  $("vActual").textContent=vFotoActual?"Esta prenda ya tiene foto. Elige otra solo si quieres reemplazarla.":"Sin foto todavía.";
  $("vMsg").textContent="";$("vProg").hidden=true;$("vSave").disabled=false;
  $("dVest").showModal();
}
$("fVest").onsubmit=async e=>{
  e.preventDefault();
  const msg=$("vMsg"),btn=$("vSave");msg.textContent="";btn.disabled=true;
  try{
    let foto=vFotoActual;
    const file=$("vFoto").files[0];
    if(file){
      if(!file.type.startsWith("image/"))throw new Error("el archivo debe ser una foto");
      $("vProg").hidden=false;$("vProg").value=0;
      const r=await uploadFile(await shrink(file),p=>{$("vProg").value=p});
      foto=r.secure_url;
    }
    const data={padre:vPadre.name,baile:$("vAlc").value,genero:$("vGen").value,nombre:$("vNom").value.trim(),foto};
    if(vEdit)await updateDoc(doc(db,"vestuario",vEdit),data);
    else await addDoc(collection(db,"vestuario"),data);
    $("dVest").close();
  }catch(err){msg.textContent="No se pudo guardar: "+err.message}
  finally{btn.disabled=false;$("vProg").hidden=true}
};
async function deleteVest(id){
  const x=vestDocs.find(v=>v.id===id);if(!x)return;
  if(!confirm(`¿Eliminar la prenda "${x.nombre}"?`))return;
  try{await deleteDoc(doc(db,"vestuario",id))}catch(err){alert("No se pudo eliminar: "+err.message)}
}
async function importBase(btn){
  if(!confirm(`Se guardarán ${BASE_VEST.length} prendas del vestuario base en la app para que puedas editarlas. ¿Continuar?`))return;
  btn.disabled=true;btn.textContent="Guardando…";
  try{
    await Promise.all(BASE_VEST.map(x=>addDoc(collection(db,"vestuario"),{padre:x.padre,baile:x.baile,genero:x.genero,nombre:x.nombre,foto:x.foto})));
  }catch(err){alert("No se pudo guardar: "+err.message);btn.disabled=false;btn.textContent="Guardar vestuario base en la app"}
}

/* ---------- Formulario de baile ---------- */
let editId=null,fm=[];
function openForm(b){
  editId=b?b.id:null;
  fm=b?mediaOf(b).map(x=>({tipo:x.tipo==="video"?"video":"image",url:x.url,titulo:x.titulo||""})):[];
  $("fAdd").reset();
  $("addTitle").textContent=b?"Editar baile":"Agregar baile";
  if(b){$("nombre").value=b.nombre||"";$("cuadro").value=padreOf(b)==="Sin cuadro"?"":padreOf(b);$("subtipo").value=subOf(b);$("pais").value=b.pais||"";$("region").value=b.region||"";$("signif").value=b.significado||"";$("letra").value=b.letra||""}
  $("addMsg").textContent="";$("prog").hidden=true;$("btnSave").disabled=false;
  renderFm();$("dAdd").showModal();
}
function renderFm(){
  $("mlist").innerHTML=fm.map((x,i)=>`<div class="mrow"><div class="th">${x.tipo==="video"?"VIDEO":`<img alt="" src="${esc(x.prev||safe(x.url))}">`}</div><input data-mt="${i}" value="${esc(x.titulo)}" placeholder="Título (opcional)" aria-label="Título del archivo ${i+1}"><button type="button" class="x" data-mrm="${i}" aria-label="Quitar archivo ${i+1}">✕</button></div>`).join("")||`<p class="hint">Aún no hay videos ni fotos.</p>`;
}
$("mlist").addEventListener("input",e=>{const i=e.target.dataset.mt;if(i!==undefined)fm[i].titulo=e.target.value});
$("mlist").addEventListener("click",e=>{const i=e.target.closest("[data-mrm]")?.dataset.mrm;if(i!==undefined){fm.splice(+i,1);renderFm()}});
$("files").onchange=e=>{
  const msg=$("addMsg");msg.textContent="";
  for(const f of e.target.files){
    const tipo=f.type.startsWith("video")?"video":f.type.startsWith("image")?"image":null;
    if(!tipo){msg.textContent=`"${f.name}" no es un video ni una foto.`;continue}
    if(tipo==="video"&&f.size>MAX_VIDEO){msg.textContent=`"${f.name}" pesa más de 100 MB. Comprímelo antes de subirlo.`;continue}
    fm.push({tipo,file:f,titulo:"",prev:tipo==="image"?URL.createObjectURL(f):""});
  }
  e.target.value="";renderFm();
};

$("fAdd").onsubmit=async e=>{
  e.preventDefault();
  const msg=$("addMsg"),btn=$("btnSave");msg.textContent="";btn.disabled=true;
  try{
    const total=fm.filter(x=>x.file).length;let n=0;
    for(const x of fm){
      if(!x.file)continue;
      n++;$("prog").hidden=false;$("prog").value=0;
      msg.style.color="var(--mute)";msg.textContent=`Subiendo ${n} de ${total}…`;
      const file=x.tipo==="image"?await shrink(x.file):x.file;
      const r=await uploadFile(file,p=>{$("prog").value=p});
      x.url=r.secure_url;x.tipo=r.resource_type==="video"?"video":"image";delete x.file;delete x.prev;
    }
    msg.style.color="";msg.textContent="";
    const pc=parseCuadro($("cuadro").value);
    const data={
      nombre:$("nombre").value.trim(),cuadro:pc.padre,subtipo:$("subtipo").value.trim()||pc.sub,pais:$("pais").value.trim(),region:$("region").value.trim(),
      significado:$("signif").value.trim(),letra:$("letra").value.trim(),
      media:fm.map(x=>({tipo:x.tipo,url:x.url,titulo:(x.titulo||"").trim()}))
    };
    if(editId)await updateDoc(doc(db,"bailes",editId),{...data,actualizado:serverTimestamp()});
    else await addDoc(collection(db,"bailes"),{...data,creado:serverTimestamp()});
    $("dAdd").close();
  }catch(err){msg.style.color="";msg.textContent="No se pudo guardar: "+err.message+(fm.some(x=>x.file)?"":" (los archivos ya subidos no se vuelven a subir si reintentas).")}
  finally{btn.disabled=false;$("prog").hidden=true;$("prog").value=0}
};

render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
